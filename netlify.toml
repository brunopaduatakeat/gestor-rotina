[build]
  command = "npm run build"
  publish = "dist"
  functions = "api"

[build.environment]
  NODE_VERSION = "20"

# ── Redirects ─────────────────────────────────────────────────────────────────
# Rotas específicas da API primeiro (evita ser capturado pelo SPA catch-all)

[[redirects]]
  from = "/api/auth/google"
  to = "/.netlify/functions/auth-google"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/callback"
  to = "/.netlify/functions/auth-callback"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/status"
  to = "/.netlify/functions/auth-status"
  status = 200
  force = true


[[redirects]]
  from = "/api/sync/calendar"
  to = "/.netlify/functions/sync-calendar"
  status = 200
  force = true

# SPA catch-all (deve ser sempre o último)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Scheduled Functions (Cron) ────────────────────────────────────────────────
[functions."cron-sync-calendar"]
  schedule = "*/15 * * * *"

[functions."cron-push-reminders"]
  schedule = "* * * * *"
