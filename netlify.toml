[build]
  command = "npm run build"
  publish = "dist"
  functions = "api"

[build.environment]
  NODE_VERSION = "20"

# ── Redirects ─────────────────────────────────────────────────────────────────
# IMPORTANTE: regras mais específicas primeiro

# /api/* → Netlify Functions (deve vir ANTES do wildcard SPA)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Todas as demais rotas → SPA (React Router client-side)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Scheduled Functions (Cron) ────────────────────────────────────────────────
[functions."cron/sync-calendar"]
  schedule = "*/15 * * * *"

[functions."cron/push-reminders"]
  schedule = "* * * * *"
